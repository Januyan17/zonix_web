name: zonixweb
description: "Zonix platform admin console."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/zonix_logo.png
